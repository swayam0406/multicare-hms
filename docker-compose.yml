services:

  db:
    image: postgres:16-alpine
    container_name: multicare-db
    environment:
      POSTGRES_DB: ${DB_NAME:-multicare_hms}
      POSTGRES_USER: ${DB_USER:-hms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # host 5433, so it doesn't clash with your local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hms_user} -d ${DB_NAME:-multicare_hms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: multicare-redis
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multicare-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "True"
      SECRET_KEY: "docker-dev-secret-change-me"
      ALLOWED_HOSTS: "127.0.0.1,localhost,web"
      DB_NAME: ${DB_NAME:-multicare_hms}
      DB_USER: ${DB_USER:-hms_user}
      DB_PASSWORD: ${DB_PASSWORD:-hms_password}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

volumes:
  postgres_data:
  static_volume:
  media_volume: