services:
  - type: web
    name: multicare-hms
    runtime: docker
    plan: free
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: multicare-hms.onrender.com,localhost,127.0.0.1
      - key: DB_NAME
        fromDatabase:
          name: multicare-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: multicare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: multicare-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: multicare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: multicare-db
          property: port
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: multicare-db
    plan: free
    databaseName: multicare_hms
    user: hms_user
    postgresMajorVersion: "16"