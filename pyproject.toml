# ==========================================
# Multicare HMS - Python tooling configuration
# ==========================================

[tool.black]
line-length = 100
target-version = ['py312']
extend-exclude = '''
/(
    migrations
  | venv
  | staticfiles
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "migrations",
    "venv",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — Black handles line length
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E", "W", "F", "I", "UP"]
"*/settings.py" = ["F405"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "core", "patients", "doctors", "appointments"]