{% extends "base.html" %}

{% block title %}Reset Password | Multicare HMS{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                    <h4 class="mt-2 mb-1">Reset your password</h4>
                    <p class="text-muted small mb-0">
                        Enter your email and we'll send you a link to reset your password.
                    </p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label small">Email address</label>
                        <input type="email" name="email" id="id_email" class="form-control" required autofocus
                            placeholder="you@example.com">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-envelope me-1"></i>Send Reset Link
                    </button>
                </form>

                <hr>
                <div class="text-center small">
                    <a href="{% url 'accounts:login' %}" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i>Back to sign in
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
